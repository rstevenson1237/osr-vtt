name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    # lint, typecheck and both builds share one `pnpm install` (SPEC-053
    # §2.2). Each step runs even if an earlier one failed, so a single push
    # surfaces every result instead of one at a time across re-pushes; the
    # job still fails overall if any of them did. The bundle-size check
    # (SPEC-055 §2) runs after both builds and needs them both on disk.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        id: lint
        if: always()
        continue-on-error: true
        run: pnpm lint
      - name: Typecheck
        id: typecheck
        if: always()
        continue-on-error: true
        run: pnpm typecheck
      - name: Build
        id: build
        if: always()
        continue-on-error: true
        run: pnpm build
      - name: Build (local)
        id: build_local
        if: always()
        continue-on-error: true
        run: pnpm build:local
      - name: Bundle size (SPEC-055 §2)
        id: bundle_size
        if: always()
        continue-on-error: true
        run: node scripts/check-bundle-size.mjs
      - name: Fail if any step above failed
        if: always()
        run: |
          fail=0
          [ "${{ steps.lint.outcome }}" = "success" ] || { echo "lint failed"; fail=1; }
          [ "${{ steps.typecheck.outcome }}" = "success" ] || { echo "typecheck failed"; fail=1; }
          [ "${{ steps.build.outcome }}" = "success" ] || { echo "build failed"; fail=1; }
          [ "${{ steps.build_local.outcome }}" = "success" ] || { echo "build:local failed"; fail=1; }
          [ "${{ steps.bundle_size.outcome }}" = "success" ] || { echo "bundle size check failed"; fail=1; }
          exit $fail

  test-emulators-core:
    # Vitest unit tests, the CampaignStore contract suite (run against both
    # FirebaseStore and MemoryStore) and Firebase rules tests, inside one
    # `firebase emulators:exec` (root package.json `test:emulators:core`).
    # Playwright is sharded separately below (SPEC-053 §2.1) — it doesn't
    # belong in this instance.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: pnpm install --frozen-lockfile
      - name: Cache Firebase emulator binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm test:emulators:core

  test-e2e:
    # Playwright, sharded four ways (SPEC-053 §2.1). Each shard is today's
    # single `firebase emulators:exec` job with a slice of the suite — same
    # specs, same two projects (chromium, mobile-chromium), nothing skipped
    # or quarantined to make a shard green.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter @osr-vtt/web exec playwright install --with-deps chromium
      - name: Cache Firebase emulator binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      # `pnpm exec` (not a bare `node …`) so `firebase` (the `firebase-tools`
      # devDependency binary) is resolvable on PATH the same way the other two
      # jobs get it via their `pnpm run` wrapper. The inner command is
      # `pnpm --filter … exec playwright test --shard=…`, not `run test:e2e --
      # --shard=…`: pnpm's `run <script> -- <args>` does not strip its own `--`
      # before forwarding to the resolved command, so playwright received a
      # literal `-- --shard=i/4` and silently ran the full suite every shard
      # (confirmed locally: `playwright test -- --shard=1/4 --list` lists all
      # 100 tests, not 25). `exec` forwards args directly with no `--` needed.
      - run: pnpm exec node scripts/firebase-emulators.mjs exec --project osr-vtt "pnpm --filter @osr-vtt/web exec playwright test --shard=${{ matrix.shard }}/4"
      # On failure, print each Playwright error-context (the DOM/accessibility
      # snapshot at failure) straight into the job log, so an e2e failure can be
      # diagnosed without downloading the artifact.
      - name: Dump Playwright error contexts on failure
        if: failure()
        shell: bash
        run: |
          shopt -s nullglob
          for f in apps/web/test-results/*/error-context.md; do
            echo "::group::$f"
            cat "$f"
            echo
            echo "::endgroup::"
          done
      # On failure, also keep the Playwright report/traces so they can be opened
      # locally if the log snapshot isn't enough.
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-shard-${{ matrix.shard }}
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
